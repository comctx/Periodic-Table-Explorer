name: Restore CC0 plutonium museum photograph (audit branch)
on:
  push:
    branches:
      - scientific-audit-2026-10
    paths:
      - .github/workflows/image-identity-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-plutonium-museum-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out audit branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify isolated working branch
        run: test "$GITHUB_REF_NAME" = "scientific-audit-2026-10"
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Replace special-notice ring photo with CC0 museum specimen
        run: python audit/replace_plutonium_museum.py
      - name: Check photo, metadata, image source, license and surrounding safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d=json.loads(Path("element-photo-data.js").read_text().split("=",1)[1].strip().rstrip(";"))
          pu=d["94"]
          assert pu["licenseUrl"]=="https://creativecommons.org/publicdomain/zero/1.0/"
          assert "Daderot" in pu["attribution"] and "Smithsonian" in pu["title"]
          assert "withholdReason" not in pu
          assert "fission" in pu["originalUrl"].lower()
          with Image.open(pu["localUrl"]) as im: im.verify()
          assert "Michigan" in d["29"]["title"]
          assert "curium" in d["96"]["title"].lower() and "neutron-source" in d["98"]["title"]
          print("Plutonium museum image and other three replacements checked")
          PY
      - name: Commit only Pu photograph and metadata to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/elements/094-pu.jpg element-photo-data.js
          git diff --cached --check
          git commit -m "Use CC0 plutonium-239 museum exhibit photo in place of LANL ring"
          git push origin HEAD:scientific-audit-2026-10
