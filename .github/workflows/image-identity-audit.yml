name: Image identity triage (audit branch only)
on:
  push:
    branches:
      - scientific-audit-2026-10
    paths:
      - .github/workflows/image-identity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-publisher-source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audit branch only
        uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Search element publisher photo galleries for matching images 61-90
        run: python audit/find_publisher_image_matches.py 61 90
      - name: Publish candidate findings (not rights clearance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-source-candidates-61-90
          path: audit/publisher-gallery-matches-61-90.json
          if-no-files-found: warn
