name: Resolve 14 element photo originals (audit branch)
on:
  push:
    branches:
      - scientific-audit-2026-10
    paths:
      - .github/workflows/image-identity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-photo-origins:
    strategy:
      fail-fast: false
      matrix:
        batch: [early, later]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Compare existing photos with publisher gallery
        run: python audit/recover_unresolved_gallery.py ${{ matrix.batch }}
      - name: Preserve matching evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-originals-${{ matrix.batch }}
          path: audit/recovered-originals-${{ matrix.batch }}.json
          if-no-files-found: warn
