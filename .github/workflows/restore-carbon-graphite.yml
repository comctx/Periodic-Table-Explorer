name: Restore authentic museum graphite photo (audit only)
on:
  push:
    branches:
      - scientific-audit-2026-10
    paths:
      - .github/workflows/restore-carbon-graphite.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carbon-graphite-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enforce branch isolation
        run: test "$GITHUB_REF_NAME" = "scientific-audit-2026-10"
      - name: Install Pillow for photo decoding and resizing
        run: python -m pip install --quiet pillow
      - name: Download authenticated museum source and replace carbon JPEG and credit
        run: python audit/replace_carbon_graphite.py
      - name: Verify real museum photograph, rights metadata and saved file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d=json.loads(Path('element-photo-data.js').read_text(encoding='utf-8').split('=',1)[1].strip().rstrip(';'))
          carbon=d['6']
          assert len(d)==118 and carbon['symbol']=='C'
          assert carbon['licenseUrl']=='https://creativecommons.org/licenses/by/4.0/'
          assert 'Marie-Lan' in carbon['attribution'] and 'graphite' in carbon['title'].lower()
          assert 'Jastrow' in carbon['attribution']
          assert 'Native_graphite_Chardonnet' in carbon['originalUrl']
          assert not carbon.get('withholdReason')
          with Image.open(carbon['localUrl']) as image:
              image.verify()
          with Image.open(carbon['localUrl']) as image:
              assert image.width>500 and image.height>500
          print('Carbon graphite museum photo and credits OK')
          PY
          node audit/check-data.mjs
      - name: Commit ONLY carbon image and changed photo catalog to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/elements/006-c.jpg element-photo-data.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "ERROR: Expected an actual changed carbon JPEG and credit"
            exit 1
          fi
          git commit -m "Restore licensed real graphite museum specimen photo in place of ambiguous carbon depiction"
          git push origin HEAD:scientific-audit-2026-10
