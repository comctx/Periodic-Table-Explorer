name: Audit-only image packaging and science regression
on:
  push:
    branches:
      - scientific-audit-2026-10
    paths:
      - audit/package_web_assets.py
      - audit/check-data.mjs
      - codemagic.yaml
      - element-photo-data.js
      - element.html
      - about.html
      - ios/PeriodicTableExplorer.xcodeproj/project.pbxproj
      - .github/workflows/audit-package-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the public branch is untouched
        run: test "$GITHUB_REF_NAME" = "scientific-audit-2026-10"
      - name: Scientific and credits regression checks
        run: node audit/check-data.mjs
      - name: Build isolated iPhone Web resource staging directory
        run: python3 audit/package_web_assets.py "$RUNNER_TEMP/pte-web/Web"
      - name: Inspect exact staged images and bundled About page
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pte-web/Web'
          photo_root = root / 'images/elements'
          photo_files = sorted(photo_root.glob('*.jpg'))
          assert len(photo_files) == 90, f'Expected 90, got {len(photo_files)}'
          catalog = json.loads((root / 'element-photo-data.js').read_text().split('=',1)[1].strip().rstrip(';'))
          blocked = {61,84,85,86,87,92,93,97,99} | set(range(100,119))
          expected = {root / catalog[str(z)]['localUrl'] for z in range(1,119) if z not in blocked}
          assert set(photo_files) == expected, 'Unexpected or absent photo in staged Web directory'
          for z in blocked:
              assert not (root / catalog[str(z)]['localUrl']).exists(), f'Withheld element {z} was packaged'
          for name in ('index.html','element.html','quiz.html','about.html',
                       'privacy.html','support.html','manifest.webmanifest','sw.js',
                       'icons/icon-192.png','icons/icon-512.png',
                       'images/bay-city-city-hall.jpg'):
              assert (root / name).is_file(), f'Missing app resource: {name}'
          about=(root/'about.html').read_text()
          assert 'Every effort has been taken' in about and 'creditList' in about
          xcode=Path('ios/PeriodicTableExplorer.xcodeproj/project.pbxproj').read_text()
          assert 'audit/package_web_assets.py' in xcode and 'cp -R' not in xcode
          magic=Path('codemagic.yaml').read_text()
          assert 'len(element_images) == 90' in magic and 'set(element_images) == expected' in magic
          print('PASS: exactly 90 app-visible images, 28 excluded, About & Credits and offline assets staged')
          print('NOTICE: static checks do not replace actual signed IPA or legal rights review')
          PY
