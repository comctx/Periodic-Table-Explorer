name: Build Periodic Table PWA icons
on:
  push:
    paths:
      - '.github/workflows/build-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert original SVG to square PNG icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url="icons/periodic-table-icon.svg",write_to=f"icons/icon-{size}.png",output_width=size,output_height=size)
          PY
          file icons/icon-192.png icons/icon-512.png
      - name: Save generated app icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --staged --quiet; then
            git commit -m "Generate 192 and 512 pixel PWA app icons"
            git push
          fi
