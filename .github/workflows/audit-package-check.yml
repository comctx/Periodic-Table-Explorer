name: Audit-only image packaging and science regression
on:
  push:
    branches:
      - scientific-audit-2026-10
    paths:
      - audit/package_web_assets.py
      - audit/verify_distribution_package.py
      - audit/check_offline_manifest.py
      - offline-photos.json
      - sw.js
      - audit/check-data.mjs
      - codemagic.yaml
      - element-photo-data.js
      - element.html
      - about.html
      - ios/PeriodicTableExplorer.xcodeproj/project.pbxproj
      - .github/workflows/audit-package-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the public branch is untouched
        run: test "$GITHUB_REF_NAME" = "scientific-audit-2026-10"
      - name: Scientific and credits regression checks
        run: node audit/check-data.mjs
      - name: Validate 92-photo offline allowlist and service worker JavaScript
        run: |
          python3 audit/check_offline_manifest.py
          node --check sw.js
      - name: Build isolated iPhone Web resource staging directory
        run: python3 audit/package_web_assets.py "$RUNNER_TEMP/pte-web/Web"
      - name: Inspect exact staged images and bundled About page
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pte-web/Web'
          photo_root = root / 'images/elements'
          photo_files = sorted(photo_root.glob('*.jpg'))
          assert len(photo_files) == 92, f'Expected 92, got {len(photo_files)}'
          catalog = json.loads((root / 'element-photo-data.js').read_text().split('=',1)[1].strip().rstrip(';'))
          blocked = {61,84,85,86,87,93,99} | set(range(100,119))
          expected = {root / catalog[str(z)]['localUrl'] for z in range(1,119) if z not in blocked}
          assert set(photo_files) == expected, 'Unexpected or absent photo in staged Web directory'
          for z in (92, 97):
              assert (root / catalog[str(z)]['localUrl']).is_file(), f'Restored audited photo {z} missing'
          assert 'VRT permission ticket 2011070810013625' in catalog['92']['attribution']
          assert catalog['97']['licenseUrl'] == 'https://creativecommons.org/licenses/by/2.0/'
          assert 'Oak Ridge National Laboratory' in catalog['97']['attribution']
          for z in (93, 99):
              assert 'withholdReason' in catalog[str(z)], f'Explicit exclusion {z} lost'
          for z in blocked:
              assert not (root / catalog[str(z)]['localUrl']).exists(), f'Withheld element {z} was packaged'
          for name in ('index.html','element.html','quiz.html','about.html',
                       'privacy.html','support.html','manifest.webmanifest','sw.js',
                       'icons/icon-192.png','icons/icon-512.png',
                       'images/bay-city-city-hall.jpg'):
              assert (root / name).is_file(), f'Missing app resource: {name}'
          about=(root/'about.html').read_text()
          assert 'Every effort has been taken' in about and 'creditList' in about
          # Separate non-element image: hidden Bay City City Hall Easter egg.
          city_source = 'https://commons.wikimedia.org/wiki/File:Bay_City_MI_City_Hall.JPG'
          city_license = 'https://creativecommons.org/licenses/by-sa/3.0/'
          for html_file in ('index.html', 'element.html', 'about.html'):
              body=(root / html_file).read_text()
              assert 'Andrew Jameson' in body, f'Bay City photographer uncredited in {html_file}'
              assert city_source in body, f'Bay City original not linked in {html_file}'
              assert city_license in body, f'Bay City CC BY-SA 3.0 link missing in {html_file}'
          assert (root / 'images/bay-city-city-hall.jpg').is_file(), 'Hidden Bay City local photograph missing'
          assert 'id="otherImagesTitle"' in about, 'Separate Bay City image credit missing'
          offline=json.loads((root/'offline-photos.json').read_text())
          assert offline['format']=='pte-offline-photos-v1'
          assert len(offline['photos'])==92 and len(set(offline['photos']))==92
          assert {root/n for n in offline['photos']}==expected
          sw=(root/'sw.js').read_text()
          assert 'pte-core-v4' in sw and 'precacheApp()' in sw
          assert 'offline-photos.json' in sw


          xcode=Path('ios/PeriodicTableExplorer.xcodeproj/project.pbxproj').read_text()
          assert 'audit/package_web_assets.py' in xcode and 'cp -R' not in xcode
          magic=Path('codemagic.yaml').read_text()
          assert 'len(element_images) == 92' in magic and 'set(element_images) == expected' in magic
          assert "'audit/verify_distribution_package.py', archives[0]" in magic, 'Future Codemagic IPA must run byte-for-byte package inspector on actual built archive'
          assert 'subprocess.run(' in magic and 'check=True' in magic, 'IPA verification must fail build on mismatches'
          print('PASS: exactly 92 app-visible images, 26 excluded, About & Credits and offline assets staged')
          print('NOTICE: static checks do not replace actual signed IPA or legal rights review')
          PY
      - name: Verify extracted Web assets and safe ZIP/IPA/MSIX-shaped test archives
        run: |
          python3 audit/verify_distribution_package.py "$RUNNER_TEMP/pte-web/Web"
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          root=Path(os.environ['RUNNER_TEMP'])/'pte-web'
          web=root/'Web'
          catalog=json.loads(Path('element-photo-data.js').read_text().split('=',1)[1].strip().rstrip(';'))
          inspector=Path('audit/verify_distribution_package.py').resolve()
          ok_zip=root/'audit-clean.zip'
          bad_zip=root/'audit-invalid-withheld.zip'
          with zipfile.ZipFile(ok_zip,'w',compression=zipfile.ZIP_DEFLATED) as out:
              for p in sorted(web.rglob('*')):
                  if p.is_file():
                      out.write(p,'Web/'+p.relative_to(web).as_posix())

          def run(path,expect):
              result=subprocess.run([sys.executable,str(inspector),str(path)],
                                    text=True,capture_output=True,timeout=75)
              if expect:
                  assert result.returncode==0, f'Expected PASS for {path}: {result.stdout} {result.stderr}'
                  assert 'exactly 92 matching element JPEGs' in result.stdout
              else:
                  assert result.returncode!=0, f'Inspector wrongly accepted invalid package {path}'
                  assert 'FAIL:' in result.stderr
              print(('EXPECTED PASS: ' if expect else 'EXPECTED REJECTION: ')+path.name)

          run(ok_zip,True)
          # .ipa and .msix are ZIP-format containers; this is synthetic QA,
          # not an actual signed Apple or Windows Store binary.
          for suffix in ('.ipa','.msix'):
              candidate=root/('audit-clean'+suffix)
              shutil.copy2(ok_zip,candidate)
              run(candidate,True)

          denied=catalog['61']['localUrl']
          shutil.copy2(ok_zip,bad_zip)
          with zipfile.ZipFile(bad_zip,'a',compression=zipfile.ZIP_DEFLATED) as out:
              out.write(denied,'Web/'+denied)
          run(bad_zip,False)

          stale=root/'Web-stale'
          shutil.copytree(web,stale)
          (stale/'about.html').write_text('<html>Lost credits</html>',encoding='utf-8')
          run(stale,False)

          dirty=root/'Web-dirty'
          shutil.copytree(web,dirty)
          forbidden=dirty/denied
          forbidden.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(denied,forbidden)
          run(dirty,False)
          print('PASS: valid staged folder/ZIP/IPA/MSIX accepted; withheld and stale packages rejected')
          PY
