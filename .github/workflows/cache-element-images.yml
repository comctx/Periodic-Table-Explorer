name: Cache element photos locally

on:
  push:
    paths:
      - ".github/workflows/cache-element-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Download, resize, and catalog element photos
        run: |
          python - <<'PY'
          import io, json, re, time, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from PIL import Image, ImageOps

          DATA_URL = "https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json"
          OUT = Path("images/elements")
          OUT.mkdir(parents=True, exist_ok=True)

          headers = {"User-Agent": "Periodic-Table-Explorer/1.0 (educational app)"}

          def wikimedia_thumb(url, width=900):
              m = re.match(r"(https://upload\.wikimedia\.org/wikipedia/commons)/([^/]+)/([^/]+)/(.+)", url)
              if not m:
                  return url
              base, a, b, name = m.groups()
              return f"{base}/thumb/{a}/{b}/{name}/{width}px-{name}"

          def get_bytes(url, timeout=30, attempts=2):
              last=None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.read()
                  except Exception as ex:
                      last=ex
                      if attempt < attempts-1:
                          time.sleep(2)
              raise last

          def source_page_image(source_url, element_name):
              if not source_url or "images-of-elements.com" not in source_url:
                  return None
              try:
                  html = get_bytes(source_url, timeout=20, attempts=2).decode("utf-8", "ignore")
              except Exception:
                  return None
              urls = re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', html, re.I)
              wanted = re.sub(r"[^a-z0-9]+", "", element_name.lower())
              candidates=[]
              for src in urls:
                  full=urljoin(source_url, src)
                  parsed=urlparse(full)
                  if not parsed.netloc.endswith("images-of-elements.com"):
                      continue
                  if not re.search(r"\.(?:jpg|jpeg|png)(?:\?|$)", full, re.I):
                      continue
                  low=full.lower()
                  if any(bad in low for bad in ("logo","banner","arrow","button","advert","icon","flag")):
                      continue
                  filename=parsed.path.rsplit("/",1)[-1].lower()
                  compact=re.sub(r"[^a-z0-9]+","",filename)
                  score=0
                  if wanted and wanted in compact: score+=100
                  if "/s/" in parsed.path.lower(): score+=30
                  if "element" in low: score+=10
                  candidates.append((score,full))
              candidates.sort(reverse=True)
              for _,full in candidates[:8]:
                  try:
                      raw=get_bytes(full, timeout=20, attempts=2)
                      test=Image.open(io.BytesIO(raw))
                      w,h=test.size
                      if w>=220 and h>=220:
                          return raw,full
                  except Exception:
                      pass
              return None

          data = json.loads(get_bytes(DATA_URL).decode("utf-8"))
          catalog = {}

          for e in data.get("elements", []):
              n = int(e.get("number") or 0)
              if not 1 <= n <= 118:
                  continue
              image = e.get("image") or {}
              url = image.get("url")
              if not url:
                  print(f"{n:03d} {e.get('symbol')}: no image URL")
                  continue

              attribution = str(image.get("attribution") or "")
              title = str(image.get("title") or e.get("name") or "")
              source_match = re.search(r"source:\s*(https?://\S+)", attribution, re.I)
              source_url = source_match.group(1).rstrip("),.;") if source_match else ""

              filename = f"{n:03d}-{str(e.get('symbol','')).lower()}.jpg"
              target = OUT / filename
              if target.exists() and target.stat().st_size > 1000:
                  print(f"{n:03d} {e.get('symbol')}: already cached")
              else:
                  raw=None
                  actual_url=url
                  source_pick=source_page_image(source_url, str(e.get("name") or ""))
                  if source_pick:
                      raw,actual_url=source_pick
                      print(f"{n:03d} {e.get('symbol')}: using source-page image {actual_url}")
                  if raw is None:
                      try:
                          if "upload.wikimedia.org" in url:
                              file_name=url.split("/")[-1]
                              download_url="https://commons.wikimedia.org/wiki/Special:FilePath/"+file_name+"?width=900"
                          else:
                              download_url=url
                          raw=get_bytes(download_url, attempts=1)
                          actual_url=download_url
                      except Exception as ex:
                          print(f"{n:03d} {e.get('symbol')}: FAILED {ex}")
                          continue
                  try:
                      im = Image.open(io.BytesIO(raw))
                      im = ImageOps.exif_transpose(im)
                      if im.mode in ("RGBA", "LA"):
                          bg = Image.new("RGB", im.size, "white")
                          alpha = im.getchannel("A")
                          bg.paste(im.convert("RGB"), mask=alpha)
                          im = bg
                      else:
                          im = im.convert("RGB")
                      im.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                      im.save(target, "JPEG", quality=86, optimize=True, progressive=True)
                      print(f"{n:03d} {e.get('symbol')}: saved {target}")
                      time.sleep(0.15)
                  except Exception as ex:
                      print(f"{n:03d} {e.get('symbol')}: FAILED decoding {ex}")
                      continue
              angle_match = re.search(r"<(https?://[^>]+)>", attribution)
              license_url = angle_match.group(1) if angle_match else ""
              if not license_url and "Creative Commons Attribution 3.0" in attribution:
                  license_url = "https://creativecommons.org/licenses/by/3.0/"
              elif not license_url and "CC BY-SA 4.0" in attribution:
                  license_url = "https://creativecommons.org/licenses/by-sa/4.0/"
              elif not license_url and "CC BY-SA 3.0" in attribution:
                  license_url = "https://creativecommons.org/licenses/by-sa/3.0/"

              catalog[str(n)] = {
                  "name": e.get("name"),
                  "symbol": e.get("symbol"),
                  "localUrl": f"images/elements/{filename}",
                  "title": title,
                  "attribution": attribution,
                  "originalUrl": url,
                  "sourceUrl": source_url,
                  "licenseUrl": license_url,
                  "note": "Image resized for Periodic Table Explorer."
              }

          js = "window.ELEMENT_PHOTOS = " + json.dumps(catalog, ensure_ascii=False, indent=2) + ";\n"
          Path("element-photo-data.js").write_text(js, encoding="utf-8")

          missing = [n for n in range(1,119) if str(n) not in catalog]
          print(f"Cached {len(catalog)} element photos; missing: {missing}")
          PY

      - name: Commit local element photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/elements element-photo-data.js
          if git diff --cached --quiet; then
            echo "No photo changes to commit."
          else
            git commit -m "Cache element photos locally"
            git push
          fi
